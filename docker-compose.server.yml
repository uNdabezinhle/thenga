# Override for a small host. Flutter web is built on a machine with the SDK
# and copied in, so this server does not download or compile Flutter.

services:
  api:
    command: gunicorn reka.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 60

  celery-worker:
    command: celery -A reka worker -Q celery -l info --concurrency 1

  edge:
    build:
      context: .
      dockerfile: deploy/Dockerfile.flutter-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_vol:/var/www/static:ro
      - media_vol:/var/www/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/thenga/certbot:/var/www/certbot:ro
      - /opt/thenga/deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
