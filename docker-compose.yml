services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment: &app_env
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-compose-secret-change-in-prod
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      POSTGRES_HOST: postgres
      POSTGRES_DB: reka
      POSTGRES_USER: reka
      POSTGRES_PASSWORD: reka
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      PUBLIC_API_BASE: http://localhost:8000
      PAYMENT_WEBHOOK_SECRET: compose-webhook-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: orders@northbound.test
      REKA_SITE_BRAND_NAME: Northbound
      MERCHANT_LEGAL_NAME: Northbound Outdoor (Pty) Ltd
      MERCHANT_VAT_NUMBER: "4123456789"
      RUN_MIGRATIONS: "true"
      SEED_ON_START: "true"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  celery-worker:
    build: .
    command: celery -A reka worker -Q celery -l info
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "false"
      SEED_ON_START: "false"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A reka beat -l info --schedule=/var/lib/celery/celerybeat-schedule
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "false"
      SEED_ON_START: "false"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - beat:/var/lib/celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reka
      POSTGRES_USER: reka
      POSTGRES_PASSWORD: reka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reka -d reka"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  flutter:
    build:
      context: .
      dockerfile: mobile/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  beat:
