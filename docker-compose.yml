services:
  api:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_northbound &&
             gunicorn reka.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    environment: &app_env
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-compose-secret-change-in-prod
      POSTGRES_HOST: postgres
      POSTGRES_DB: reka
      POSTGRES_USER: reka
      POSTGRES_PASSWORD: reka
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      PUBLIC_API_BASE: http://localhost:8000
      PAYMENT_WEBHOOK_SECRET: compose-webhook-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: orders@northbound.test
      REKA_SITE_BRAND_NAME: Northbound
      MERCHANT_LEGAL_NAME: Northbound Outdoor (Pty) Ltd
      MERCHANT_VAT_NUMBER: "4123456789"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  celery-worker:
    build: .
    command: celery -A reka worker -Q celery -l info
    environment:
      <<: *app_env
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - mailpit

  celery-beat:
    build: .
    command: celery -A reka beat -l info
    environment:
      <<: *app_env
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reka
      POSTGRES_USER: reka
      POSTGRES_PASSWORD: reka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reka -d reka"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
