# Production-style edge config for Reka / Northbound
# Terminate TLS here; proxy to gunicorn on the private network.

upstream reka_api {
    server api:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS (uncomment when certs are mounted)
# server {
#     listen 80;
#     server_name api.reka.example;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Security headers (also set in Django; belt and braces)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /health/ {
        proxy_pass http://reka_api;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://reka_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://reka_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 1d;
    }

    # Flutter / SPA shell
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # App Links / Universal Links placeholders
    location /.well-known/ {
        root /usr/share/nginx/html;
        default_type application/json;
    }
}
