components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 64
        line1:
          type: string
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        suburb:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        province:
          type: string
          maxLength: 120
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 2
        recipient_name:
          type: string
          maxLength: 200
        recipient_phone:
          type: string
          maxLength: 32
        is_default_shipping:
          type: boolean
        is_default_billing:
          type: boolean
      required:
      - city
      - id
      - line1
      - postal_code
      - recipient_name
    Attribute:
      type: object
      properties:
        key:
          type: string
          maxLength: 64
        value:
          type: string
          maxLength: 255
      required:
      - key
      - value
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          nullable: true
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - name
      - slug
    DeviceRegistration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
          maxLength: 512
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_seen_at
      - platform
      - token
    ModuleEnum:
      enum:
      - auth
      - catalogue
      - cart
      - orders
      - payments
      - shipping
      - promotions
      - admin
      type: string
      description: |-
        * `auth` - Authentication
        * `catalogue` - Catalogue
        * `cart` - Cart
        * `orders` - Orders
        * `payments` - Payments
        * `shipping` - Shipping
        * `promotions` - Promotions
        * `admin` - Administration
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          maxLength: 32
        status:
          $ref: '#/components/schemas/StatusEnum'
        currency:
          type: string
          maxLength: 3
        subtotal:
          type: string
          readOnly: true
        discount_total:
          type: string
          readOnly: true
        shipping_total:
          type: string
          readOnly: true
        grand_total:
          type: string
          readOnly: true
        shipping_method:
          type: string
          maxLength: 64
        payment_method:
          type: string
          maxLength: 32
        shipping_address_text:
          type: string
        tracking_stage:
          type: integer
          readOnly: true
        item_count:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/OrderEvent'
          readOnly: true
        placed_at:
          type: string
          format: date-time
          readOnly: true
        cooling_off:
          type: string
          readOnly: true
      required:
      - cooling_off
      - discount_total
      - events
      - grand_total
      - id
      - item_count
      - items
      - placed_at
      - reference
      - shipping_total
      - subtotal
      - tracking_stage
    OrderEvent:
      type: object
      properties:
        from_status:
          type: string
          maxLength: 32
        to_status:
          type: string
          maxLength: 32
        note:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - to_status
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_name_snapshot:
          type: string
          maxLength: 255
        sku_snapshot:
          type: string
          maxLength: 64
        unit_price:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        line_total:
          type: string
          readOnly: true
      required:
      - id
      - line_total
      - product_name_snapshot
      - quantity
      - sku_snapshot
      - unit_price
    PaginatedAddressList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
