<!DOCTYPE html>
<html><body style="font-family:system-ui,sans-serif;background:#F3F4EF;color:#101512;padding:24px">
  <div style="max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;border:1px solid #D8DCD3">
    <h1 style="font-size:20px;margin:0 0 12px">Reset your password</h1>
    <p style="color:#6E7B72;line-height:1.55">Someone requested a password reset for your {{ brand }} account.</p>
    <p style="font-family:ui-monospace,monospace;background:#F3F4EF;padding:12px;border-radius:8px;word-break:break-all">{{ token }}</p>
    <p style="font-size:12px;color:#6E7B72">Expires in 1 hour · single use. Ignore if this wasn't you.</p>
  </div>
</body></html>
