<!DOCTYPE html>
<html><body style="font-family:system-ui,sans-serif;background:#F3F4EF;color:#101512;padding:24px">
  <div style="max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;border:1px solid #D8DCD3">
    <h1 style="font-size:20px;margin:0 0 8px">Out for delivery</h1>
    <p>Order <strong style="font-family:ui-monospace,monospace">{{ order.reference }}</strong> is on its way.</p>
    {% if tracking %}<p style="font-family:ui-monospace,monospace">Tracking: {{ tracking }}</p>{% endif %}
    <p style="font-size:12px;color:#6E7B72;margin-top:18px">— {{ brand }}</p>
    {% if platform_footer %}<p style="font-size:12px;color:#6E7B72">{{ platform_footer }}</p>{% endif %}
  </div>
</body></html>
