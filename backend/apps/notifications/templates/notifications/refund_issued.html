<!DOCTYPE html>
<html><body style="font-family:system-ui,sans-serif;background:#F3F4EF;color:#101512;padding:24px">
  <div style="max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;border:1px solid #D8DCD3">
    <h1 style="font-size:20px;margin:0 0 8px">Refund processed</h1>
    <p>Order <strong style="font-family:ui-monospace,monospace">{{ order.reference }}</strong></p>
    <p style="font-size:22px;font-weight:700;font-family:ui-monospace,monospace;color:#0E2A22">
      {{ currency }} {{ refund_amount }}
    </p>
    {% if reason %}<p style="color:#6E7B72">Reason: {{ reason }}</p>{% endif %}
    <p style="font-size:12px;color:#6E7B72;font-family:ui-monospace,monospace">{{ provider_reference }}</p>
    <p style="font-size:12px;color:#6E7B72;margin-top:18px">— {{ brand }}</p>
  </div>
</body></html>
