<!DOCTYPE html>
<html><body style="font-family:system-ui,sans-serif;background:#F3F4EF;color:#101512;padding:24px">
  <div style="max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;border:1px solid #D8DCD3">
    <h1 style="font-size:20px;margin:0 0 12px">Verify your email</h1>
    <p style="color:#6E7B72;line-height:1.55">Welcome to <strong>{{ brand }}</strong>. Confirm your address so you can place orders.</p>
    <p style="font-family:ui-monospace,monospace;background:#F3F4EF;padding:12px;border-radius:8px;word-break:break-all">{{ token }}</p>
    <p><a href="{{ link }}" style="display:inline-block;background:#0E2A22;color:#C8F751;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:600">Verify email</a></p>
    <p style="font-size:12px;color:#6E7B72">Expires in 24 hours · single use</p>
  </div>
</body></html>
