name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reka
          POSTGRES_USER: reka
          POSTGRES_PASSWORD: reka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reka -d reka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: reka
      POSTGRES_USER: reka
      POSTGRES_PASSWORD: reka
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-secret-not-for-production
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check

      - name: Migrations
        run: python manage.py migrate --noinput

      - name: Seed
        run: python manage.py seed_northbound

      - name: Tests
        run: >
          python manage.py test
          apps.pricing apps.accounts apps.cart apps.orders
          apps.payments apps.notifications -v 1

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
